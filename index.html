<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Reconciliation (Bank vs Zoho vs Driver)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:Arial;background:#f4f6f9;padding:20px}
.container{max-width:1200px;margin:auto;background:#fff;padding:20px;border-radius:12px}
button{padding:10px 15px;border:none;background:#0b2b4a;color:#fff;border-radius:6px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:8px;border:1px solid #ddd;font-size:13px}
th{background:#0b2b4a;color:#fff}
.match{background:#d4edda}
.mismatch{background:#f8d7da}
.missing{background:#fff3cd}
</style>
</head>
<body>
<div class="container">
<h2>3-Way Fuel Reconciliation</h2>

<label>Upload Zoho</label>
<input type="file" id="zoho">

<label>Upload Bank</label>
<input type="file" id="bank">

<label>Upload Driver Log</label>
<input type="file" id="driver">

<br><br>
<button onclick="reconcile()">Reconcile</button>

<table id="table">
<thead>
<tr>
<th>ER No</th>
<th>Vehicle</th>
<th>Driver</th>
<th>Bank</th>
<th>Zoho</th>
<th>Driver Log</th>
<th>Bank-Zoho</th>
<th>Bank-Driver</th>
<th>Status</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
let zohoData=[], bankData=[], driverData=[];

function readFile(file, callback){
 const reader=new FileReader();
 reader.onload=e=>{
  const wb=XLSX.read(e.target.result,{type:'array'});
  const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
  callback(data);
 };
 reader.readAsArrayBuffer(file);
}

document.getElementById('zoho').onchange=e=>readFile(e.target.files[0],d=>zohoData=d);
document.getElementById('bank').onchange=e=>readFile(e.target.files[0],d=>bankData=d);
document.getElementById('driver').onchange=e=>readFile(e.target.files[0],d=>driverData=d);

function getKey(row){
 return (row['ER No']||row['Auth No']||row['ER Number']||'').toString().trim();
}

function getAmount(row){
 return Number(row['Amount']||row['Fuel Total']||row['Grand Total']||0);
}

function reconcile(){
 const map={};

 zohoData.forEach(r=>{
  const k=getKey(r);
  if(!map[k]) map[k]={};
  map[k].zoho=getAmount(r);
  map[k].vehicle=r['Vehicle']||'';
  map[k].driver=r['Driver']||'';
 });

 bankData.forEach(r=>{
  const k=getKey(r);
  if(!map[k]) map[k]={};
  map[k].bank=getAmount(r);
  map[k].vehicle=map[k].vehicle||r['Vehicle'];
  map[k].driver=map[k].driver||r['Driver'];
 });

 driverData.forEach(r=>{
  const k=getKey(r);
  if(!map[k]) map[k]={};
  map[k].driverAmt=getAmount(r);
  map[k].vehicle=map[k].vehicle||r['Vehicle'];
  map[k].driver=map[k].driver||r['Driver'];
 });

 const tbody=document.querySelector('#table tbody');
 tbody.innerHTML='';

 Object.keys(map).forEach(k=>{
  const r=map[k];
  const bank=r.bank||0;
  const zoho=r.zoho||0;
  const driver=r.driverAmt||0;

  const v1=bank-zoho;
  const v2=bank-driver;

  let status='Matched',cls='match';

  if(!r.bank||!r.zoho||!r.driverAmt){
   status='Missing';cls='missing';
  }else if(Math.abs(v1)>1||Math.abs(v2)>1){
   status='Mismatch';cls='mismatch';
  }

  const tr=document.createElement('tr');
  tr.className=cls;

  tr.innerHTML=`
  <td>${k}</td>
  <td>${r.vehicle||''}</td>
  <td>${r.driver||''}</td>
  <td>${bank.toFixed(2)}</td>
  <td>${zoho.toFixed(2)}</td>
  <td>${driver.toFixed(2)}</td>
  <td>${v1.toFixed(2)}</td>
  <td>${v2.toFixed(2)}</td>
  <td>${status}</td>`;

  tbody.appendChild(tr);
 });
}
</script>
</body>
</html>
