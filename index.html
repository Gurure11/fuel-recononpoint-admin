<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnPoint Fuel Reconciliation System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;background:#eef4fa;padding:20px}
.container{max-width:1400px;margin:auto;background:#fff;padding:20px;border-radius:14px}
button{padding:10px 15px;border:none;background:#0b2b4a;color:#fff;border-radius:6px;cursor:pointer}
input,select{padding:8px;margin:5px 0;width:100%}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:8px;border:1px solid #ddd;font-size:12px}
th{background:#0b2b4a;color:#fff}
.match{background:#dff5e3}
.mismatch{background:#fce3e3}
.missing{background:#fff0d8}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
</style>
</head>
<body>
<div class="container">
<h2>Fuel Reconciliation System (Bank + Zoho + Driver Log)</h2>

<div class="grid">
<div>
<label>Upload Zoho File</label>
<input type="file" id="zoho">
</div>
<div>
<label>Upload Bank File</label>
<input type="file" id="bank">
</div>
<div>
<label>Filter View</label>
<select id="groupBy">
<option value="vehicle">Vehicle</option>
<option value="costCenter">Cost Center</option>
<option value="driver">Driver</option>
<option value="department">Department</option>
</select>
</div>
</div>

<br>
<button onclick="reconcile()">Run Reconciliation</button>
<button onclick="exportExcel()">Export Excel</button>
<button onclick="exportCSV()">Export CSV</button>

<canvas id="pieChart"></canvas>

<table id="table">
<thead>
<tr>
<th>ER No</th>
<th>Vehicle</th>
<th>Driver</th>
<th>Cost Center</th>
<th>Department</th>
<th>Bank</th>
<th>Zoho</th>
<th>Driver Log</th>
<th>Variance (B-Z)</th>
<th>Variance (B-D)</th>
<th>Status</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>
const SHEET_ID="1SnhLTWgzJfkKNmIvtj8uwa-8x7TsnRtqkfX3deEuHIQ";
const SHEET_NAME="Fuel Log";

let zoho=[], bank=[], driverLog=[];

function readFile(file, cb){
 const reader=new FileReader();
 reader.onload=e=>{
  const wb=XLSX.read(e.target.result,{type:'array'});
  cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));
 };
 reader.readAsArrayBuffer(file);
}

document.getElementById('zoho').onchange=e=>readFile(e.target.files[0],d=>zoho=d);
document.getElementById('bank').onchange=e=>readFile(e.target.files[0],d=>bank=d);

async function loadDriverLog(){
 const url=`https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;
 const res=await fetch(url);
 driverLog=await res.json();
}

function key(r){return (r['ER No']||r['Auth No']||r['ER Number']||'').toString().trim();}
function num(v){return Number(String(v||0).replace(/[^0-9.-]/g,''))||0;}

async function reconcile(){
 await loadDriverLog();
 const map={};

 zoho.forEach(r=>{
  const k=key(r);
  if(!map[k]) map[k]={};
  map[k].zoho=num(r.Amount);
  map[k].vehicle=r.Vehicle||'';
  map[k].driver=r.Driver||'';
  map[k].costCenter=r['Cost Center']||'';
  map[k].department=r.Department||'';
 });

 bank.forEach(r=>{
  const k=key(r);
  if(!map[k]) map[k]={};
  map[k].bank=num(r.Amount);
 });

 driverLog.forEach(r=>{
  const k=key(r);
  if(!map[k]) map[k]={};
  map[k].driverAmt=num(r['Fuel Total']||r['Grand Total']);
 });

 const tbody=document.querySelector('#table tbody');
 tbody.innerHTML='';

 let summary={};

 Object.keys(map).forEach(k=>{
  const r=map[k];
  const b=r.bank||0,z=r.zoho||0,d=r.driverAmt||0;
  const v1=b-z,v2=b-d;

  let status='Matched',cls='match';

  if(!r.bank||!r.zoho||!r.driverAmt){status='Missing';cls='missing';}
  else if(Math.abs(v1)>1||Math.abs(v2)>1){status='Mismatch';cls='mismatch';}

  const tr=document.createElement('tr');
  tr.className=cls;

  tr.innerHTML=`<td>${k}</td><td>${r.vehicle||''}</td><td>${r.driver||''}</td><td>${r.costCenter||''}</td><td>${r.department||''}</td><td>${b.toFixed(2)}</td><td>${z.toFixed(2)}</td><td>${d.toFixed(2)}</td><td>${v1.toFixed(2)}</td><td>${v2.toFixed(2)}</td><td>${status}</td>`;

  tbody.appendChild(tr);

  const group=r[document.getElementById('groupBy').value]||'Unknown';
  if(!summary[group]) summary[group]=0;
  summary[group]+=b;
 });

 renderChart(summary);
}

function renderChart(summary){
 const ctx=document.getElementById('pieChart');
 new Chart(ctx,{type:'pie',data:{labels:Object.keys(summary),datasets:[{data:Object.values(summary)}]}});
}

function exportExcel(){
 const wb=XLSX.utils.table_to_book(document.getElementById('table'));
 XLSX.writeFile(wb,'fuel_report.xlsx');
}

function exportCSV(){
 const wb=XLSX.utils.table_to_book(document.getElementById('table'));
 XLSX.writeFile(wb,'fuel_report.csv');
}
</script>
</body>
</html>
